[project]
name = "unsa-mind"
version = "0.1.0"
description = "Asistente virtual institucional de la UNSA (RAG con clean architecture, API REST y A2A)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6",
  "apscheduler>=3.10,<4",
  "beautifulsoup4>=4.12",
  "markdownify>=0.13",
  "pypdf>=4",
]

[project.optional-dependencies]
scrapling = ["scrapling[fetchers]"]
qdrant = ["qdrant-client>=1.9"]
local-embeddings = ["sentence-transformers>=3"]
ocr-light = ["pymupdf>=1.24"]  # PDF escaneados con Tesseract (binario del sistema)
ocr = ["pymupdf>=1.24", "markitdown[pdf,docx,pptx,xlsx]>=0.1.8", "markitdown-ocr>=0.1.1"]  # + Office
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
unsa-mind = "unsa_mind.interfaces.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unsa_mind"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
