services:
  api:
    build: .
    env_file: .env
    environment:
      UNSA_DATA_DIR: /data
    volumes:
      - unsa_data:/data
      - ./config:/app/config:ro
    ports: ["8000:8000"]

  web:
    build: ./web
    environment:
      PUBLIC_API_URL: http://api:8000
    depends_on: [api]
    ports: ["3000:3000"]

  # Opcional: UNSA_VECTOR_STORE=qdrant UNSA_QDRANT_URL=http://qdrant:6333 (pip install .[qdrant])
  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["qdrant"]
    volumes: [qdrant_data:/qdrant/storage]
    ports: ["6333:6333"]

volumes:
  unsa_data:
  qdrant_data:
